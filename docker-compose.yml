version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: itdaily-redis
    ports:
      - "127.0.0.1:6380:6380"
    command: redis-server --port 6380 --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data

  app:
    image: itdaily-backend:latest
    container_name: itdaily-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - PORT=8000
    depends_on:
      - redis
    restart: always
    command: npm run start:prod # override for hot-reload

volumes:
  redis-data:
